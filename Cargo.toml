[workspace]
members = [
    "poseidon-hash",
    "crypto",
    "signer",
    "api-client",
    "lighter-sdk",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json", "multipart"] }
tokio = { version = "1.0", features = ["full"] }
dotenv = "0.15"
rand = "0.8"
log = "0.4"
env_logger = "0.11"
